<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" shape-rendering="crispEdges">
  <style>
    .bg { fill: #ffffff; stroke: #d4d4d8; }
    .fg { fill: #090c12; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b0f17; stroke: #27272a; }
      .fg { fill: #ffffff; }
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="23" height="23" rx="4" stroke-width="1" />
  <g class="fg" transform="translate(2, 7)">
    <!-- Row 0..1: ü dots & z top bar -->
    <rect x="0" y="0" width="2" height="2" />
    <rect x="4" y="0" width="2" height="2" />
    <rect x="14" y="0" width="6" height="2" />
    <!-- Row 2..3: z upper right step -->
    <rect x="18" y="2" width="2" height="2" />
    <!-- Row 4..5: ü arms, x upper, z mid -->
    <rect x="0" y="4" width="2" height="2" />
    <rect x="4" y="4" width="2" height="2" />
    <rect x="7" y="4" width="2" height="2" />
    <rect x="11" y="4" width="2" height="2" />
    <rect x="16" y="4" width="2" height="2" />
    <!-- Row 6..7: ü arms, x center, z lower step -->
    <rect x="0" y="6" width="2" height="2" />
    <rect x="4" y="6" width="2" height="2" />
    <rect x="9" y="6" width="2" height="2" />
    <rect x="14" y="6" width="2" height="2" />
    <!-- Row 8..9: ü bottom, x lower, z bottom bar -->
    <rect x="0" y="8" width="6" height="2" />
    <rect x="7" y="8" width="2" height="2" />
    <rect x="11" y="8" width="2" height="2" />
    <rect x="14" y="8" width="6" height="2" />
  </g>
</svg>
